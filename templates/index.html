<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CI/CD To-Do Demo</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <h1>My To-Do List</h1>

    <form id="todo-form">
        <input
            id="todo-input"
            type="text"
            placeholder="Enter a task..."
            required
        >

        <button type="submit">
            Add Task
        </button>
    </form>

    <ul id="todo-list"></ul>

</div>

<script src="/static/app.js"></script>

</body>
</html>
